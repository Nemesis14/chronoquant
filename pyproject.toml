[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoquant"
version = "0.1.0"
description = "Real-time ML trading signal prediction system for Binance OHLCV data."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "python-binance",
    "matplotlib",
    "ta",
    "statsmodels",
    "numpy>=2.4.6",
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "taew>=0.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]
