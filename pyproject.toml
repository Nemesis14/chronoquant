[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoquant"
version = "0.1.0"
description = "Real-time ML trading signal prediction system for Binance OHLCV data."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "python-binance",
    "numpy>=2.4.6",
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "plotly>=5.24.0",
    "pydantic>=2.0",
    "duckdb>=1.5.3",
    "pyarrow>=24.0.0",
    "polars>=1.0.0",
    "optuna>=4.0.0",
    "tabulate>=0.10.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.48.0",
    "mcp>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
    "httpx>=0.28.1",
]
# Opcionális kutatási csoport (epic_072): CPU torch (autoencoder embedding) + tslearn (k-Shape / DTW).
# Telepítés: uv sync --group research  (a fő runtime nem tölti le)
research = [
    "torch",
    "tslearn",
    # epic_073 t935: idősor-alapmodell embedding (Chronos-Bolt; HF checkpoint futáskor töltődik le a HF cache-be)
    "chronos-forecasting>=2.3,<3",
]

# CPU-only torch wheel-ek explicit indexről (csak a torch-ra; a research csoporthoz kötve)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", group = "research" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E741"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts    = "--import-mode=importlib"
markers = [
    "smoke: callable with dummy/tmp data, correct return type — no real DB required",
    "sanity: business invariants on real or synthetic data (gaps, nulls, counts, distributions)",
    "perf: wall-clock timing benchmarks against the production database",
    "integration: cross-layer flow tests (ohlcv → features → target → predictions)",
]
